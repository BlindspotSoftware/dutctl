version: 1.0.0-alpha.4
devices:
  self:
    desc: >
      This device represents no DUT but the dutagent itself to demonstrate the
      dummy modules.

      The dummy modules showcase different module capabilities such as printing,
      console interaction

      and file transfer.
    cmds:
      status:
        desc: Report status information via the dummy-status module
        uses:
          - module: dummy-status
            passthrough: true
      console:
        desc: Echo user input through a console via the dummy-console module
        uses:
          - module: dummy-console
            passthrough: true
      file-transfer:
        desc: Transfer a file, process it, and send it back via the dummy-ft module
        uses:
          - module: dummy-ft
            passthrough: true
      combined:
        desc: >
          Demonstrates chaining multiple dummy modules: prints status, transfers
          a file,

          and prints status again.
        uses:
          - module: dummy-status
            args:
              - foo
              - bar
          - module: dummy-ft
            passthrough: true
          - module: dummy-status
