version: 1.0.0-beta.1
devices:
  fancy-server:
    desc: A server with power control via an Intellinet PDU
    cmds:
      power:
        desc: Control the power (on|off|toggle|status) via PDU
        uses:
          - module: pdu
            passthrough: true
            with:
              vendor: intellinet
              host: http://192.168.1.100
              user: admin
              password: admin
              outlet: 6
  lab-server:
    desc: A server with power control via a Gude PDU
    cmds:
      power:
        desc: Control the power (on|off|toggle|status) via PDU
        uses:
          - module: pdu
            passthrough: true
            with:
              vendor: gude
              host: http://192.168.1.200
              user: admin
              password: admin
              outlet: 1
  netio-board:
    desc: A board connected to NETIO output 1
    cmds:
      power:
        desc: Control the power (on|off|toggle|status) via NETIO
        uses:
          - module: pdu
            passthrough: true
            with:
              vendor: netio
              host: http://192.168.1.201:8080
              user: netio
              password: example-password
              outlet: 0
