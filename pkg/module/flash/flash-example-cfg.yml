version: 1.0.0-alpha.5
devices:
  xyz:
    desc: A mainboard that needs to be flashed during firmware development
    cmds:
      flash:
        desc: |
          Basic demo of the Flash module.
        uses:
          - module: flash
            passthrough: true
            with:
              tool: /usr/sbin/flashprog
              programmer: dediprog
      flash-bmc:
        desc: |
          Write an OpenBMC image to the BMC flash. A rewrite of the same image
          writes only u-boot-env and rwfs, and a hung DediProg is power-cycled.
        uses:
          - module: flash
            passthrough: true
            with:
              tool: flashprog
              programmer: dediprog:spispeed=24M
              skipUnchanged:
                preset: openbmc-static
              recover:
                hubs: ["1-1", "2"]
                device: "0483:dada"
