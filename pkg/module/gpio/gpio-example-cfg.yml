version: 1.0.0-beta.2
devices:
  rocket:
    desc: A rocket that can be fired
    cmds:
      fire:
        desc: Push the big red button
        uses:
          - module: gpio-button
            passthrough: true
            with:
              pin: 9
              label: Big red button
      reset:
        desc: Reset the rocket
        uses:
          - module: gpio-button
            passthrough: true
            with:
              pin: 10
              label: Reset line
              activelow: true
      light:
        desc: Turn on the light
        uses:
          - module: gpio-switch
            passthrough: true
            with:
              pin: 11
              label: Light
              initial: 'on'
