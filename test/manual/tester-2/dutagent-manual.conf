[Unit]
Wants=fake-serial.service
After=fake-serial.service

[Service]
# The serial module opens a pty from fake-serial.service.
DeviceAllow=char-pts rw
# Run the build deploy.sh installs instead of the packaged binary, so dpkg's files stay untouched.
ExecStart=
ExecStart=/usr/local/bin/dutagent -a 0.0.0.0:2024 -c /etc/dutagent/config.yaml
