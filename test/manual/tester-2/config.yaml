---
version: 0
devices:
  fwci-dutctl-tester-2:
    desc: "Manual dutctl tester, a Raspberry Pi with a fake serial and an SF600 with a test SPI flash"
    cmds:
      flash:
        desc: "Test SPI flash in the SF600"
        uses:
          - module: flash
            passthrough: true
            with:
              tool: "dpcmd"
      serial:
        desc: "Fake serial, see fake-serial.service"
        uses:
          - module: serial
            passthrough: true
            with:
              port: "/run/fake-serial/ttyS2"
              baudrate: 115200
      system-info:
        desc: "Report information about the dutagent system"
        uses:
          - module: agent-status
            passthrough: true
      wait:
        desc: "Wait for the given duration"
        uses:
          - module: time-wait
            passthrough: true
            with:
              duration: 1s
      run:
        desc: "Run a shell command on the dutagent"
        uses:
          - module: shell
            passthrough: true
            with:
              path: bash
      upload:
        desc: "Upload a file from the client to the dutagent"
        uses:
          - module: file
            passthrough: true
            with:
              operation: "upload"
              destination: "/tmp/dutctl-manual-upload.txt"
      download:
        desc: "Download a file from the dutagent to the client"
        uses:
          - module: file
            passthrough: true
            with:
              operation: "download"
              source: "/tmp/dutctl-manual-download.txt"
      dummy-status:
        desc: "Report status, arguments passed through"
        uses:
          - module: dummy-status
            passthrough: true
      dummy-status-args:
        desc: "Report status with arguments fixed by the configuration"
        uses:
          - module: dummy-status
            args:
              - foo
              - bar
      dummy-repeat:
        desc: "Repeat input"
        uses:
          - module: dummy-repeat
            passthrough: true
      dummy-file-transfer:
        desc: "Transfer a file through a two-module chain"
        args:
          - name: source-file
            desc: "Source file path"
          - name: dest-file
            desc: "Destination file path"
        uses:
          - module: dummy-status
            args:
              - transferring
              - "${source-file}"
          - module: dummy-ft
            args:
              - "${source-file}"
              - "${dest-file}"
