---
version: 0
devices:
  fwci-dutctl-tester:
    desc: "A fwci dutctl tester"
    cmds:
      power:
        desc: "Power switch"
        uses:
          - module: gpio-switch
            passthrough: true
            with:
              pin: 26
              label: DUT power
              initial: off
              # GPIO pin 26, physical pin 37
              # https://pinout.xyz/pinout/pin26_gpio7/
      serial:
        desc: "Host serial"
        uses:
          - module: serial
            passthrough: true
            with:
              port: "/home/oscar/ttyS2"
              baud: 115200
      console:
        desc: "Interactive host serial console"
        uses:
          - module: serial
            args: ["-i"]
            with:
              port: "/home/oscar/ttyS2"
              baud: 115200
      boot:
        desc: "A step, then the interactive host serial console, as a boot command is shaped"
        uses:
          - module: wrap-print
            args: ["power-cycle"]
          - module: serial
            args: ["-i"]
            with:
              port: "/home/oscar/ttyS2"
              baud: 115200
      flash:
        desc: "Host SPI flash chip"
        uses:
          - module: flash
            passthrough: true
            with:
              tool: "dpcmd"
      pdu:
        desc: "Power switch via the Gude PDU (on|off|toggle|status)"
        uses:
          - module: pdu
            passthrough: true
            with:
              vendor: gude
              host: "http://gpdu-2p-fwci-ductl-tester.firmwareci.9e.network"
              # 0-based; keep in sync with PduOutlet in
              # .firmwareci/duts/dut-rpi-dutctl-tester/dut.yaml
              outlet: 0
          - module: time-wait
            with:
              duration: 1s
      system-info:
        desc: "Report information about the dutagent system"
        uses:
          - module: agent-status
            passthrough: true
      wait:
        desc: "Wait for the given duration"
        uses:
          - module: time-wait
            passthrough: true
            with:
              duration: 1s
      run:
        desc: "Run a shell command on the dutagent"
        uses:
          - module: shell
            passthrough: true
            with:
              path: bash
      upload:
        desc: "Upload a file from the client to the dutagent"
        uses:
          - module: file
            passthrough: true
            with:
              operation: "upload"
              destination: "/tmp/dutctl-fwci-upload.txt"
      download:
        desc: "Download a file from the dutagent to the client"
        uses:
          - module: file
            passthrough: true
            with:
              operation: "download"
              source: "/tmp/dutctl-fwci-download.txt"
      echo:
        desc: "Print the arguments"
        uses:
          - module: wrap-print
            passthrough: true
