version: 1.0.0-beta.1
devices:
  device2:
    desc: Device 2
    cmds:
      power:
        desc: Show or switch the power of the simulated demo board
        uses:
          - module: demo-switch
            passthrough: true
            with:
              line: power
      console:
        desc: Attach to the console of the simulated demo board
        uses:
          - module: demo-console
