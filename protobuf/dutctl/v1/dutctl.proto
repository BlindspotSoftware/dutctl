syntax = "proto3";

package dutctl.v1;

option go_package = "github.com/BlindspotSoftware/dutctl/protobuf/gen/dutctl/v1;dutctlv1";

// DeviceService defines the service for interacting with devices.
service DeviceService {
  rpc List(ListRequest) returns (ListResponse) {}
  rpc Commands(CommandsRequest) returns (CommandsResponse) {}
  rpc Details(DetailsRequest) returns (DetailsResponse) {}
  rpc Run(stream RunRequest) returns (stream RunResponse) {}
  rpc Lock(LockRequest) returns (LockResponse) {}
  rpc Unlock(UnlockRequest) returns (UnlockResponse) {}
}

// ListRequest is sent by the client to request a list of devices connected to the agent.
message ListRequest {}

// ListResponse is sent by the agent in response to a ListRequest.
message ListResponse {
  repeated DeviceInfo devices = 1;
}

// DeviceInfo describes a single device and its current lock state.
message DeviceInfo {
  string name = 1;
  LockState lock = 2; // Unset when the device is not locked.
}

// LockState describes the lock state of a device. The enclosing DeviceInfo
// leaves its lock field unset when the device is not locked, so this message
// does not repeat that signal as a separate boolean.
message LockState {
  string owner = 1;
  int64 locked_at = 2; // Unix seconds.
  int64 expires_at = 3; // Unix seconds, 0 means no expiry.
}

// CommandsRequest is sent by the client to request a list of commands available for
// a specific device.
message CommandsRequest {
  string device = 1;
}

// CommandsResponse is sent by the agent in response to a CommandsRequest.
message CommandsResponse {
  repeated string commands = 1;
}

// DetailsRequest is sent by the client to request further information for specific
// device or a specific command. The type of information is defined by keyword.
message DetailsRequest {
  string device = 1;
  string command = 2;
  string keyword = 3;
}

// DetailsResponse is sent by the agent in response to a DetailsRequest.
message DetailsResponse {
  string details = 1;
}

// RunRequest is sent by the client to start a command execution on a device and
// to interact with the agent while the command runs. The first RunRequest of a
// stream must carry a Command message.
message RunRequest {
  oneof msg {
    Command command = 1;
    ConsoleInput console_input = 2;
    File file = 3;
    ConsoleControl console_control = 4;
  }
}

// RunResponse is sent by the agent while a command runs: the command's output
// (Print), the traffic of a console and the events that frame it, or a file
// transfer.
message RunResponse {
  oneof msg {
    Print print = 1;
    ConsoleOutput console_output = 2;
    FileRequest file_request = 3;
    File file = 4;
    ConsoleOpen console_open = 5;
    ConsoleClose console_close = 6;
  }
}

// Command is used by the client to start a command execution on a device.
message Command {
  string device = 1;
  string command = 2;
  repeated string args = 3;
}

// Print is used by the agent to send the output of a command execution to the
// client. It may be sent at any time, also while a console is open; the client
// shows Print and console output in the order received.
message Print {
  bytes text = 1;
}

// A console is how a module and the user interact through the client's standard
// streams. The agent opens it with ConsoleOpen and closes it with ConsoleClose;
// in between, ConsoleInput carries the user's input to the module and
// ConsoleOutput the module's output to the user. The payload is opaque: no hop
// alters it. A module has one console at a time, and the agent closes it when
// the module returns. The end of the stream closes a console that is still open.
//
// The client sends ConsoleInput and ConsoleControl only for an open console and
// marks them with the console's id; the agent discards input for any other
// console. ConsoleOutput from the agent outside an open console is a protocol
// violation.

// ConsoleMode tells the client how the module uses its console, so that the
// client can configure a terminal accordingly. The client treats an unknown
// value as LINE.
enum ConsoleMode {
  CONSOLE_MODE_UNSPECIFIED = 0;
  // The module reads newline-terminated lines of text. A terminal stays in its
  // usual line-editing mode: the user sees what they type and edits the line,
  // Enter sends it, and Ctrl-C still interrupts the client.
  CONSOLE_MODE_LINE = 1;
  // The module consumes bytes as typed and produces bytes for a terminal, as a
  // serial port does. A terminal is switched to raw mode: every key, Ctrl-C and
  // Escape included, is sent at once and unchanged, and output is written as
  // received. The client keeps a local key sequence to end the run.
  CONSOLE_MODE_RAW = 2;
}

// ConsoleOpen is sent by the agent when a module opens its console. It precedes
// every ConsoleOutput of that console. The id is unique within the run, so the
// client can mark its input for exactly this console.
message ConsoleOpen {
  uint32 id = 1;
  ConsoleMode mode = 2;
}

// ConsoleClose is sent by the agent when the console ends: the module returned
// or opened another console. No ConsoleOutput follows for it.
message ConsoleClose {}

// ConsoleInput is sent by the client: the user's input for the open console.
message ConsoleInput {
  uint32 id = 1;
  bytes data = 2;
}

// ConsoleOutput is sent by the agent: the module's output on the open console,
// on its standard output or its standard error stream.
message ConsoleOutput {
  oneof data {
    bytes stdout = 1;
    bytes stderr = 2;
  }
}

// ConsoleControl is sent by the client: an event for the open console that is
// not input data.
message ConsoleControl {
  uint32 id = 1;
  oneof control {
    ConsoleEof eof = 2;
  }
}

// ConsoleEof tells the agent that the user's input ended: the client's standard
// input reached its end. The module's console input then reports end of file,
// while its output continues. The client sends it after any pending input, for
// every console of the run whose input ends. It is not an end of the stream:
// file transfers and output keep flowing.
message ConsoleEof {}

// FileRequest is used by the agent to request a file from the client.
message FileRequest {
  string path = 1;
}

// File is used by the client and the agent to transfer a file.
message File {
  string path = 1;
  bytes content = 2;
}

// LockRequest is sent by the client to acquire or extend a lock on a device.
// The lock owner identity is carried in an HTTP header, not in this message.
//
// Locks are advisory: any caller may force-release another's lock
// (UnlockRequest.force), so callers are expected to reserve a device only as
// long as needed and to release it when done.
message LockRequest {
  string device = 1;
  int64 duration_seconds = 2; // 0 applies the agent's default duration; otherwise the lock expires after this many seconds.
}

// LockResponse is sent by the agent in response to a successful LockRequest.
message LockResponse {
  string device = 1;
  LockState lock = 2;
}

// UnlockRequest is sent by the client to release a lock on a device.
// The lock owner identity is carried in an HTTP header, not in this message.
message UnlockRequest {
  string device = 1;
  bool force = 2; // Release the lock regardless of owner.
}

// UnlockResponse is sent by the agent in response to a successful UnlockRequest.
message UnlockResponse {}

// RelayService defines the service for forwarding communication via relay server.
// NOTE: This is an experimental service and may change in the future.
service RelayService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
}

// RegisterRequest is sent by a device agent to register with the relay server.
// NOTE: This is an experimental service and may change in the future.
message RegisterRequest {
  repeated string devices = 1; // List of devices the agent is connected to.
  string address = 2; // Address of the agent sending the request.
}

// RegisterResponse is sent by the relay server in response to a successful RegisterRequest.
// NOTE: This is an experimental service and may change in the future.
message RegisterResponse {}
