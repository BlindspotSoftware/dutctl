# Builds the documentation site for every pull request, so that a broken link,
# an unplaced page or a failed embed fails it, and deploys the site from main
# to GitHub Pages (ADR-0042). The repository's Pages source must be "GitHub
# Actions".

name: Docs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Updated on purpose, not by each build: Hugo deprecates settings quickly.
  HUGO_VERSION: 0.169.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_${HUGO_VERSION}_linux-amd64.tar.gz\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate the program output the site shows
        run: sh site/generate.sh

      - name: Build the site
        working-directory: site
        run: hugo --panicOnWarning --minify

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
