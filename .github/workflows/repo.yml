name: Repo
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version
      - name: Install commitlint
        run: |
          #npm install conventional-changelog-conventionalcommits
          #npm install commitlint@latest
          npm install @commitlint/{cli,config-conventional}
          npx commitlint --version

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        id: commitlint
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
          log=$(npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose)
          if echo $log | grep -q 'message must be signed off'; then
            echo "nosignoff=true" >> $GITHUB_OUTPUT
          fi

      # A commit that changes a decision record, any Markdown file in
      # docs/decisions/ other than README.md and template.md, must be
      # a docs commit that changes nothing outside docs/decisions/, see
      # "Documentation commits" in CONTRIBUTING.md. Runs also when commitlint
      # failed, so that both results show at once.
      - name: Check that ADRs come in docs commits of their own
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          commits=$(git rev-list --reverse --no-merges "origin/$BASE_REF..$HEAD_SHA")
          for c in $commits; do
            files=$(git diff-tree --no-commit-id --name-only -r "$c")
            records=$(grep -E '^docs/decisions/[^/]+\.md$' <<< "$files" | grep -v -x -e docs/decisions/README.md -e docs/decisions/template.md || true)
            [ -n "$records" ] || continue
            subject=$(git log -1 --format=%s "$c")
            if ! grep -q '^docs: ' <<< "$subject"; then
              echo "::error::${c:0:12} \"$subject\" changes an ADR, so it must be a docs commit"
              status=1
            fi
            others=$(grep -v '^docs/decisions/' <<< "$files" | tr '\n' ' ' || true)
            if [ -n "$others" ]; then
              echo "::error::${c:0:12} \"$subject\" changes an ADR, so it must not change files outside docs/decisions/: $others"
              status=1
            fi
          done
          exit $status

  decision-records:
    name: Decision records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every Markdown file in docs/decisions/ other than README.md and
      # template.md is a decision record. Check that each is named
      # NNNN-title-in-kebab-case.md with a number of its own, so that ADR-NNNN
      # names one record, and that its front matter has a status from
      # docs/decisions/README.md; a superseded record must name another record
      # that exists. A pull request is checked as merged into main when it was
      # opened or last pushed to, and a re-run checks that same merge, so a
      # number that another pull request had taken by then fails here too.
      - name: Check names, numbers and statuses of the decision records
        run: |
          cd docs/decisions
          status=0
          error() { echo "::error file=docs/decisions/$1::$1 $2"; status=1; }
          declare -A taken
          records=()
          for f in *.md; do
            case $f in README.md | template.md) continue ;; esac
            [ -e "$f" ] || continue
            if [[ ! $f =~ ^[0-9]{4}(-[a-z0-9]+)+\.md$ ]]; then
              error "$f" "must be named NNNN-title-in-kebab-case.md, in lower case"
              continue
            fi
            n=${f:0:4}
            if [ -n "${taken[$n]}" ]; then
              error "$f" "has the same number as ${taken[$n]}"
            else
              taken[$n]=$f
            fi
            records+=("$f")
          done
          for f in "${records[@]}"; do
            # Print the status in the front matter, which runs from the --- on
            # line 1 to the next ---, ignoring trailing blanks and CRs. Fail if
            # there is no front matter.
            if ! s=$(awk '{ sub(/[ \t\r]+$/, "") }
                          NR == 1 { if ($0 != "---") exit 1; next }
                          $0 == "---" { closed = 1; print s; exit }
                          sub(/^status:[ \t]+/, "") { s = $0 }
                          END { if (!closed) exit 1 }' "$f"); then
              error "$f" "must start with front matter between two --- lines"
              continue
            fi
            case $s in
              proposed | accepted | rejected | deprecated) ;;
              "superseded by ADR-"[0-9][0-9][0-9][0-9])
                by=${s#"superseded by ADR-"}
                if [ "$by" = "${f:0:4}" ]; then
                  error "$f" "cannot be superseded by itself"
                elif [ -z "${taken[$by]}" ]; then
                  error "$f" "is superseded by ADR-$by, which does not exist"
                fi
                ;;
              "") error "$f" "has no status in its front matter" ;;
              *) error "$f" "has the status '$s'; use proposed, accepted, rejected, deprecated or superseded by ADR-NNNN" ;;
            esac
          done
          exit $status
