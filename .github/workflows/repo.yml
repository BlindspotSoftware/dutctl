name: Repo
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version
      - name: Install commitlint
        run: |
          #npm install conventional-changelog-conventionalcommits
          #npm install commitlint@latest
          npm install @commitlint/{cli,config-conventional}
          npx commitlint --version

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        id: commitlint
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose
          log=$(npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose)
          if echo $log | grep -q 'message must be signed off'; then
            echo "nosignoff=true" >> $GITHUB_OUTPUT
          fi

      # A commit that changes a decision record, any Markdown file in
      # docs/decisions/ other than README.md and template.md, must be
      # a docs commit that changes nothing outside docs/decisions/, see
      # "Documentation commits" in CONTRIBUTING.md. Runs also when commitlint
      # failed, so that both results show at once.
      - name: Check that ADRs come in docs commits of their own
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          commits=$(git rev-list --reverse --no-merges "origin/$BASE_REF..$HEAD_SHA")
          for c in $commits; do
            files=$(git diff-tree --no-commit-id --name-only -r "$c")
            records=$(grep -E '^docs/decisions/[^/]+\.md$' <<< "$files" | grep -v -x -e docs/decisions/README.md -e docs/decisions/template.md || true)
            [ -n "$records" ] || continue
            subject=$(git log -1 --format=%s "$c")
            if ! grep -q '^docs: ' <<< "$subject"; then
              echo "::error::${c:0:12} \"$subject\" changes an ADR, so it must be a docs commit"
              status=1
            fi
            others=$(grep -v '^docs/decisions/' <<< "$files" | tr '\n' ' ' || true)
            if [ -n "$others" ]; then
              echo "::error::${c:0:12} \"$subject\" changes an ADR, so it must not change files outside docs/decisions/: $others"
              status=1
            fi
          done
          exit $status
