---
name: Hardware-Integration
# The tests on real hardware in FirmwareCI. FirmwareCI reports each test as a
# check of its own, named after this workflow and the test, such as
# Hardware-Integration - GPIO-Power. GoReleaser is used only as a build tool
# here, not for releases.

on:
  pull_request: {}
  merge_group: {}
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  DISABLE_TELEMETRY: 1
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job to build binaries and linux packages with goreleaser, without making release
  build-with-goreleaser:
    name: Build-Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build packages with goreleaser (without actually making release)
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          goreleaser release --draft --snapshot --clean
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/
          retention-days: 14 days

  # Submit the tests to FirmwareCI.
  client-agent-integration:
    name: Submit
    # Pull requests from forks run without repository secrets, so FWCI_TOKEN
    # would be empty here. The Hardware-Integration-Fork workflow picks those up
    # instead, from the base repository and behind a required-reviewer
    # environment.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs:
      - build-with-goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin/

      - name: Get names of binaries
        id: filenames
        run: |
          echo "dutctl_path=$(ls ./bin/dutctl_linux_amd64_*/dutctl)" >> "${GITHUB_OUTPUT}"
          echo "dutctl_pkg_path=$(ls ./bin/dutctl_*_arm64.deb)" >> "${GITHUB_OUTPUT}"
      - name: Debug
        run: |
          echo "dutctl_path:   ${{ steps.filenames.outputs.dutctl_path }}"
          echo "dutctl_pkg_path: ${{ steps.filenames.outputs.dutctl_pkg_path }}"

      - name: Install task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy SPI flash image
        working-directory: .firmwareci
        run: task misc:dummy-binary-for-flashing

      - name: Upload to FirmwareCI
        uses: docker://firmwareci/action:v6.1
        with:
          TOKEN: "${{ secrets.FWCI_TOKEN }}"
          WORKFLOW_NAME: Hardware-Integration
          COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
          BINARIES: DUTCTL=${{ steps.filenames.outputs.dutctl_path }};REMOTE_PKG=${{ steps.filenames.outputs.dutctl_pkg_path }};CONFIG=./test/test-dutagent-cfg.yaml;TASKFILE=./.firmwareci/Taskfile.yml;DUMMY_SPI_FLASH_ROM=./.firmwareci/dummy_binary.rom
          GITHUB_INSTALLATION_ID: 45795153
