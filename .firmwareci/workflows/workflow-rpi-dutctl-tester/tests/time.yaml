---
name: time module
description: Verify the time module reports and sets time.

stages:
  - name: Test time module
    steps:
      - cmd: cmd
        name: Wait for the configured duration
        transport:
          proto: local
        parameters:
          executable: "[[input.DUTCTL]]"
          args:
            [
              "-s", "[[attributes.DutagentEndpoint]]",
              "[[attributes.DeviceName]]",
              "wait",
            ]
          expect:
            - regex: "Waiting for 1s"
        options:
          timeout: 15s

      - cmd: cmd
        name: Wait for a duration given on the command line
        transport:
          proto: local
        parameters:
          executable: "[[input.DUTCTL]]"
          args:
            [
              "-s", "[[attributes.DutagentEndpoint]]",
              "[[attributes.DeviceName]]",
              "wait",
              "3s",
            ]
          expect:
            - regex: "Waiting for 3s"
        options:
          timeout: 15s

      - cmd: shell
        name: Verify the wait really blocks
        transport:
          proto: local
        parameters:
          command: "start=$(date +%s); [[input.DUTCTL]] -s [[attributes.DutagentEndpoint]] [[attributes.DeviceName]] wait 3s; end=$(date +%s); echo elapsed=$((end-start))"
          expect:
            - regex: "elapsed=([3-9]|[1-9][0-9]+)"
        options:
          timeout: 30s
